<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Widget DOM diagnostic</title>
<style>body{font-family:monospace;font-size:13px;padding:16px;background:#fff;color:#111}pre{white-space:pre-wrap;word-break:break-word}</style>
</head>
<body>
<h1>Widget DOM diagnostic</h1>
<pre id="out">waiting for widget...</pre>
<script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6afef8f829d5b191ee8855fc" ></script>
<script>
(function(){
  var out = document.getElementById('out');
  var lines = [];
  function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
  function rectOf(el){ var r = el.getBoundingClientRect(); return {w:Math.round(r.width), h:Math.round(r.height), fromBottom:Math.round(innerHeight - r.bottom), fromRight:Math.round(innerWidth - r.right), top:Math.round(r.top), left:Math.round(r.left)}; }
  function describe(el, depth){
    var cs = getComputedStyle(el);
    var d = {tag: el.tagName, id: el.id || '', cls: (el.className && el.className.toString ? el.className.toString().slice(0,60) : ''),
      pos: cs.position, bottom: cs.bottom, right: cs.right, z: cs.zIndex, rect: rectOf(el)};
    return d;
  }
  function findBubble(root, path, acc){
    var kids = root.children || [];
    for (var i = 0; i < kids.length; i++){
      var k = kids[i];
      var r = k.getBoundingClientRect();
      var p = path + '>' + k.tagName + (k.className && k.className.toString ? '.' + k.className.toString().slice(0,30) : '');
      if (r.width >= 40 && r.width <= 90 && r.height >= 40 && r.height <= 90 && (innerHeight - r.bottom) < 60 && (innerWidth - r.right) < 80){
        acc.push({path: p, info: describe(k, 0)});
      }
      findBubble(k, p, acc);
      if (k.shadowRoot) findBubble(k.shadowRoot, p + '::shadow', acc);
    }
  }
  function bubbleRect(){
    var acc = []; findBubble(document.body, 'body', acc);
    return acc;
  }
  function waitFor(n){
    var el = document.querySelector('chat-widget');
    if (el && el.shadowRoot !== null || (el && n > 6)) { setTimeout(run, 2500); return; }
    if (n > 20) { log('TIMEOUT: chat-widget state=' + (el ? 'present-no-shadow' : 'absent')); setTimeout(run, 500); return; }
    setTimeout(function(){ waitFor(n+1); }, 500);
  }
  function testStyle(name, css){
    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
    var acc = bubbleRect();
    log('TEST ' + name + ' -> bubble: ' + JSON.stringify(acc.map(function(a){ return a.info.rect; })));
    st.remove();
  }
  function run(){
    var el = document.querySelector('chat-widget');
    log('viewport: ' + innerWidth + 'x' + innerHeight);
    if (!el){ log('chat-widget: ABSENT'); return; }
    var attrs = {}; for (var i = 0; i < el.attributes.length; i++) attrs[el.attributes[i].name] = el.attributes[i].value;
    log('host attrs: ' + JSON.stringify(attrs));
    log('host: ' + JSON.stringify(describe(el, 0)));
    log('host shadowRoot: ' + !!el.shadowRoot + ', light children: ' + el.children.length);
    if (el.shadowRoot){
      for (var j = 0; j < el.shadowRoot.children.length; j++) log('shadow child ' + j + ': ' + JSON.stringify(describe(el.shadowRoot.children[j], 1)));
    }
    for (var c = 0; c < el.children.length; c++) log('light child ' + c + ': ' + JSON.stringify(describe(el.children[c], 1)));
    var acc = bubbleRect();
    log('bubble candidates: ' + JSON.stringify(acc, null, 1));
    testStyle('bottom96', 'chat-widget{bottom:96px !important}');
    testStyle('transform96', 'chat-widget{transform:translateY(-96px) !important}');
    testStyle('hostFixedBottom96', 'chat-widget{position:fixed !important; bottom:96px !important}');
    log('DONE');
    document.title = 'DIAGNOSTIC DONE';
  }
  waitFor(0);
})();
</script>
</body>
</html>
