<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>375px verification</title>
<style>body{font-family:monospace;font-size:13px;padding:16px;background:#fff;color:#111}pre{white-space:pre-wrap;word-break:break-word;border:1px solid #ccc;padding:10px;max-width:700px}iframe{border:2px solid #142D55}</style>
</head>
<body>
<h1>375px verification — chat bubble vs mobile bar</h1>
<iframe id="fr" src="widget-frame.html" width="375" height="700"></iframe>
<pre id="mirror">waiting for frame results...</pre>
<script>
(function(){
  var m = document.getElementById('mirror');
  var fr = document.getElementById('fr');
  var t = setInterval(function(){
    try {
      var d = fr.contentDocument;
      var o = d && d.getElementById('out');
      if (o && o.textContent.indexOf('DONE') >= 0 || (o && o.textContent.indexOf('TIMEOUT') >= 0)) {
        m.textContent = o.textContent;
        document.title = 'VERIFY READY';
        clearInterval(t);
      } else if (o) { m.textContent = o.textContent; }
    } catch(e) {}
  }, 700);
})();
</script>
</body>
</html>
